[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bm-notebook"
version = "1.0.1"
description = "Native, reactive, JS-free Jupyter-compatible notebook IDE powered by Qt6 (PySide6) and Python AST DAG execution"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5",
    "jupyter_client>=8.0",
    "ipykernel>=6.0",
    "pygments>=2.14",
]

[project.scripts]
bm-notebook = "bm_notebook.app:main"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
include = ["bm_notebook*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "C90", "N", "PERF", "PIE", "PL", "PT", "RET", "RUF", "S", "SIM", "TRY", "UP"]
ignore = [
    "N802",  # Qt6 (mousePressEvent, keyPressEvent, ...) and ast.NodeVisitor (visit_Name, ...) require camelCase overrides
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004"]
